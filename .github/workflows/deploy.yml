name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist

      - name: Project Deployed URL in Pipeline Logs
        run: |
          echo "================================================================="
          echo "🚀 SRF India Webapp Successfully Deployed!"
          echo "🔗 Public GitHub Pages URL: https://swarupcreates.github.io/spine-research-foundation-india-website/"
          echo "================================================================="
